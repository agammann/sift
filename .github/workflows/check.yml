name: Sift checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        node: ["24.15.0", "26.13.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run notices
      - run: pnpm run build
      - run: pnpm test
      - name: Exercise release publisher safeguards
        run: node --test tests/publish-release.test.cjs
      - run: pnpm audit --audit-level=low
      - run: pnpm run release
      - run: pnpm run verify:package
      - name: Keep the tested Linux release archive
        if: matrix.os == 'ubuntu-22.04' && matrix.node == '24.15.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sift-release
          path: |
            artifacts/sift-local-*.tgz
            artifacts/sift-local-*.tgz.sha256
            artifacts/SHA256SUMS
          if-no-files-found: error
  node24-types:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Verify the Node 24 API type floor
        shell: bash
        run: |
          printf 'import { create } from "node:vfs"; create();\n' > "$RUNNER_TEMP/sift-node26-only.ts"
          args=(--ignoreConfig --noEmit --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2023 --types node --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" "$RUNNER_TEMP/sift-node26-only.ts")
          pnpm exec tsc "${args[@]}"
          pnpm add --save-dev --save-exact --ignore-scripts @types/node@24.13.3
          node -e 'if (require("./node_modules/@types/node/package.json").version !== "24.13.3") process.exit(1)'
          if pnpm exec tsc "${args[@]}" > "$RUNNER_TEMP/sift-node24-probe.log" 2>&1; then
            echo 'Node 24 declarations unexpectedly accepted node:vfs'
            exit 1
          fi
          grep -F 'TS2307' "$RUNNER_TEMP/sift-node24-probe.log"
          grep -F 'node:vfs' "$RUNNER_TEMP/sift-node24-probe.log"
          pnpm exec tsc --noEmit
  node-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/test-node-compat.ts seed "$RUNNER_TEMP/sift-node-fixture-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: pnpm exec tsx scripts/test-node-compat.ts upgrade "$RUNNER_TEMP/sift-node-fixture-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - run: pnpm exec tsx scripts/test-node-compat.ts rollback "$RUNNER_TEMP/sift-node-fixture-${{ github.run_id }}-${{ github.run_attempt }}"
  package_acceptance:
    name: Released archive on ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        node: ["24.15.0", "26.13.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Download the Linux archive (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-release
          path: artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        shell: bash
        run: sleep 10
      - name: Download the Linux archive (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-release
          path: artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        shell: bash
        run: sleep 20
      - name: Download the Linux archive (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-release
          path: artifacts
      - run: pnpm run verify:package
      - name: Exercise github-script with a no-write release fixture
        if: matrix.os == 'ubuntu-22.04' && matrix.node == '24.15.0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            const version = require('./package.json').version;
            const messages = [];
            const fixtureGithub = { rest: { repos: { listReleases() {} } },
              paginate: async () => [{ tag_name: 'v' + version, draft: false }] };
            const fixtureContext = { eventName: 'push', ref: 'refs/heads/main', sha: 'a'.repeat(40),
              repo: { owner: 'fixture', repo: 'fixture' } };
            await publish({ github: fixtureGithub, context: fixtureContext, core: { info: message => messages.push(message) } });
            if (!messages.some(message => message.includes('already published; leaving it unchanged')))
              throw new Error('Published release guard did not return as expected');
  artifact_missing_guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-nonexistent-transfer-guard
      - name: Reject an unexpected missing-artifact result
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    name: Publish verified release
    needs: [verify, node24-types, node-compatibility, package_acceptance, artifact_missing_guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sift-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the accepted archive (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Read the accepted archive (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Read the accepted archive (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sift-release
          path: release-artifacts
      - name: Publish complete archive and checksum assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({ github, context, core });
